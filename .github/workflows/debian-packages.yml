name: Debian packages

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit or tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distribution: ubuntu24.04
          - image: ubuntu:26.04
            distribution: ubuntu26.04
          - image: debian:13
            distribution: debian13
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Install package build dependencies
        run: bash packaging/debian/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and inspect package
        run: |
          bash packaging/debian/test-startup-links.sh
          bash packaging/debian/test-postinst.sh
          bash packaging/debian/build.sh "$GITHUB_WORKSPACE/artifacts"
      - name: Check installation without systemd running
        run: bash packaging/debian/smoke-install.sh artifacts/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.distribution }}-amd64
          path: |
            artifacts/*.deb
            artifacts/*.buildinfo
            artifacts/*.changes
          if-no-files-found: error
